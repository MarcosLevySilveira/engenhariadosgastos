  <main>
    <div class="form-header">
      <h1>Relatório Mensal</h1>
    </div>

    <details class="filter-panel" open>
      <summary>Mês de referência</summary>
      <div class="filter-row">
        <label>Selecione o mês
          <select id="mesSelecionado" onchange="init()"></select>
        </label>
      </div>
    </details>

    <div id="conteudo"></div>
  </main>

<script>
    document.getElementById("navToggle").addEventListener("click", function () {
        const nav = document.getElementById("site-nav");
        const aberto = nav.classList.toggle("open");
        this.setAttribute("aria-expanded", aberto);
    });

    function formatarMoeda(valor) {
        return valor.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const TIPOS_IMPULSO = ["Pequeno impulso", "Grande impulso", "Arrependimento", "Setback não-evitável"];

    function getDespesas() {
        return JSON.parse(localStorage.getItem("despesas_demo")) || [];
    }

    function getCartas() {
        return JSON.parse(localStorage.getItem("cartasEuFuturo_demo")) || [];
    }

    function mesAtualISO() {
        const d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }

    function nomeMes(mesISO) {
        const [ano, mes] = mesISO.split("-").map(Number);
        const d = new Date(ano, mes - 1, 1);
        return d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    }

    function mesAnterior(mesISO) {
        const [ano, mes] = mesISO.split("-").map(Number);
        const d = new Date(ano, mes - 2, 1);
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }

    function popularSeletorMeses() {
        const despesas = getDespesas();
        const mesesComDados = new Set(despesas.map(d => d.data.slice(0, 7)));
        mesesComDados.add(mesAtualISO());
        const meses = Array.from(mesesComDados).sort().reverse();

        const select = document.getElementById("mesSelecionado");
        select.innerHTML = meses.map(m => `<option value="${m}">${nomeMes(m)}</option>`).join("");
        if (meses.includes(mesAtualISO())) select.value = mesAtualISO();
    }

    function calcularMes(despesas, mesISO) {
        const doMes = despesas.filter(d => d.data.slice(0, 7) === mesISO);
        const saidas = doMes.filter(d => d.tipo === "Saída");
        const entradas = doMes.filter(d => d.tipo === "Entrada");

        const totalGasto = saidas.reduce((s, d) => s + d.valor, 0);
        const totalRenda = entradas.reduce((s, d) => s + d.valor, 0);
        const totalInvestido = saidas
            .filter(d => (d.categoriaMaster || "") === "Investimentos")
            .reduce((s, d) => s + d.valor, 0);

        const impulso = saidas.filter(d => TIPOS_IMPULSO.includes(d.tipoGasto));
        const totalImpulso = impulso.reduce((s, d) => s + d.valor, 0);
        const pctImpulso = totalGasto > 0 ? (totalImpulso / totalGasto) * 100 : 0;

        const planejados = saidas.filter(d => d.tipoGasto === "Planejado").length;
        const scoreControle = saidas.length > 0
            ? Math.max(0, Math.min(100, (planejados / saidas.length) * 50 + (1 - (totalGasto > 0 ? totalImpulso / totalGasto : 0)) * 50))
            : 0;

        const rsgsImpulso = impulso.filter(d => d.rsg).map(d => Number(d.rsg));
        const avgRsgImpulso = rsgsImpulso.length > 0 ? rsgsImpulso.reduce((a, b) => a + b, 0) / rsgsImpulso.length : 5;
        const scoreDescontrole = Math.max(0, Math.min(100,
            (totalGasto > 0 ? (totalImpulso / totalGasto) * 60 : 0) + ((5 - avgRsgImpulso) / 5) * 40
        ));

        const gatilhoMap = {};
        impulso.forEach(d => {
            if (!d.gatilho) return;
            if (!gatilhoMap[d.gatilho]) gatilhoMap[d.gatilho] = { valor: 0, freq: 0 };
            gatilhoMap[d.gatilho].valor += d.valor;
            gatilhoMap[d.gatilho].freq += 1;
        });
        const sabotadores = Object.entries(gatilhoMap)
            .map(([g, v]) => ({ gatilho: g, valor: v.valor, freq: v.freq, score: v.valor * v.freq }))
            .sort((a, b) => b.score - a.score);

        return {
            totalGasto, totalRenda, totalInvestido, totalImpulso, pctImpulso,
            scoreControle, scoreDescontrole, topSabotador: sabotadores[0] || null,
            qtdLancamentos: saidas.length
        };
    }

    // Comparação em cascata pro "Resultado financeiro do mês":
    // 1) média histórica de investimento, se houver; 2) renda do mês, se houver; 3) total gasto do mês.
    function resultadoFinanceiroCascata(despesas, mesISO, dadosMes) {
        const mesesAnteriores = Array.from(new Set(despesas.map(d => d.data.slice(0, 7))))
            .filter(m => m < mesISO);

        let somaInvestimentoHistorico = 0;
        let mesesComInvestimento = 0;
        mesesAnteriores.forEach(m => {
            const investNoMes = despesas
                .filter(d => d.data.slice(0, 7) === m && d.tipo === "Saída" && (d.categoriaMaster || "") === "Investimentos")
                .reduce((s, d) => s + d.valor, 0);
            if (investNoMes > 0) { somaInvestimentoHistorico += investNoMes; mesesComInvestimento++; }
        });

        const mediaInvestimento = mesesComInvestimento > 0 ? somaInvestimentoHistorico / mesesComInvestimento : 0;

        if (mediaInvestimento > 0) {
            const meses = dadosMes.totalImpulso / mediaInvestimento;
            return `Isso equivale a <strong>${meses.toFixed(1)} meses</strong> do que você costuma investir.`;
        }
        if (dadosMes.totalRenda > 0) {
            const pct = (dadosMes.totalImpulso / dadosMes.totalRenda) * 100;
            return `Isso é <strong>${pct.toFixed(0)}%</strong> da sua renda registrada no mês.`;
        }
        if (dadosMes.totalGasto > 0) {
            return `Isso é <strong>${dadosMes.pctImpulso.toFixed(0)}%</strong> de tudo que você gastou no mês.`;
        }
        return "Ainda não há dados suficientes pra essa comparação.";
    }

    function gerarSumarioExecutivo(mesISO, atual, anterior) {
        const variacao = anterior.totalGasto > 0
            ? ((atual.totalGasto - anterior.totalGasto) / anterior.totalGasto) * 100
            : null;

        let texto = `Em ${nomeMes(mesISO)}, seu gasto total foi R$ ${formatarMoeda(atual.totalGasto)}`;
        if (variacao !== null) {
            texto += variacao >= 0
                ? `, ${variacao.toFixed(0)}% acima do mês anterior.`
                : `, ${Math.abs(variacao).toFixed(0)}% abaixo do mês anterior.`;
        } else {
            texto += ".";
        }

        if (atual.topSabotador) {
            const pctSabotador = atual.totalImpulso > 0 ? (atual.topSabotador.valor / atual.totalImpulso) * 100 : 0;
            texto += ` O principal ponto de atenção foi <strong>${atual.topSabotador.gatilho}</strong>, respondendo por ${pctSabotador.toFixed(0)}% dos gastos por impulso do mês.`;
        }

        return texto;
    }

    function gerarRecomendacao(atual) {
        if (atual.qtdLancamentos === 0) {
            return "Ainda não há lançamentos suficientes nesse mês pra gerar uma recomendação.";
        }
        if (atual.scoreDescontrole > 60 && atual.topSabotador) {
            return `Seu Score de Descontrole está alto esse mês. O ponto de maior alavancagem é observar de perto os gastos ligados a <strong>${atual.topSabotador.gatilho}</strong> — é onde a maior parte do impulso se concentrou.`;
        }
        if (atual.scoreDescontrole > 30) {
            return "Fase de mapeamento — normal no início. Continue registrando com atenção ao Tipo de Gasto e ao RSG; o padrão vai ficar mais claro nos próximos meses.";
        }
        return "Boa consciência sobre os próprios gastos esse mês. Poucos sinais de impulso não-observado.";
    }

    function init() {
        const despesas = getDespesas();

        if (!document.getElementById("mesSelecionado").options.length) {
            popularSeletorMeses();
        }

        const mesISO = document.getElementById("mesSelecionado").value || mesAtualISO();
        const atual = calcularMes(despesas, mesISO);
        const anterior = calcularMes(despesas, mesAnterior(mesISO));
        const anterior2 = calcularMes(despesas, mesAnterior(mesAnterior(mesISO)));

        const cartas = getCartas().filter(c => c.data.slice(0, 7) === mesISO);
        const cartasPorCategoria = {};
        cartas.forEach(c => {
            if (!cartasPorCategoria[c.categoria]) cartasPorCategoria[c.categoria] = [];
            cartasPorCategoria[c.categoria].push(c);
        });

        const conteudo = document.getElementById("conteudo");

        if (atual.qtdLancamentos === 0) {
            conteudo.innerHTML = `<div class="insight-card-box"><p class="insight-empty" style="text-align:center;">Nenhum gasto registrado em ${nomeMes(mesISO)}.</p></div>`;
            return;
        }

        conteudo.innerHTML = `
            <h2 class="resultado-secao-titulo">Sumário executivo</h2>
            <div class="insight-card-box">
                <p style="margin:0; line-height:1.6;">${gerarSumarioExecutivo(mesISO, atual, anterior)}</p>
            </div>

            <h2 class="resultado-secao-titulo">Tendência — últimos 3 meses</h2>
            <div class="insight-grid">
                <div class="insight-card-box">
                    <h3>Score de Controle</h3>
                    <p class="insight-card-value">${nomeMes(mesAnterior(mesAnterior(mesISO))).split(" de")[0]}: ${anterior2.scoreControle.toFixed(0)} · ${nomeMes(mesAnterior(mesISO)).split(" de")[0]}: ${anterior.scoreControle.toFixed(0)} · ${nomeMes(mesISO).split(" de")[0]}: ${atual.scoreControle.toFixed(0)}</p>
                </div>
                <div class="insight-card-box">
                    <h3>Score de Descontrole</h3>
                    <p class="insight-card-value">${nomeMes(mesAnterior(mesAnterior(mesISO))).split(" de")[0]}: ${anterior2.scoreDescontrole.toFixed(0)} · ${nomeMes(mesAnterior(mesISO)).split(" de")[0]}: ${anterior.scoreDescontrole.toFixed(0)} · ${nomeMes(mesISO).split(" de")[0]}: ${atual.scoreDescontrole.toFixed(0)}</p>
                </div>
                <div class="insight-card-box">
                    <h3>% Impulso sobre o total gasto</h3>
                    <p class="insight-card-value">${nomeMes(mesAnterior(mesAnterior(mesISO))).split(" de")[0]}: ${anterior2.pctImpulso.toFixed(0)}% · ${nomeMes(mesAnterior(mesISO)).split(" de")[0]}: ${anterior.pctImpulso.toFixed(0)}% · ${nomeMes(mesISO).split(" de")[0]}: ${atual.pctImpulso.toFixed(0)}%</p>
                </div>
            </div>

            <h2 class="resultado-secao-titulo">Recomendação do período</h2>
            <div class="insight-card-box">
                <p style="margin:0; line-height:1.6;">${gerarRecomendacao(atual)}</p>
            </div>

            <h2 class="resultado-secao-titulo">Resultado financeiro do mês</h2>
            <div class="insight-card-box">
                <p style="margin:0 0 8px;">Total gasto em impulso/arrependimento: <strong>R$ ${formatarMoeda(atual.totalImpulso)}</strong></p>
                <p style="margin:0;">${resultadoFinanceiroCascata(despesas, mesISO, atual)}</p>
            </div>

            <h2 class="resultado-secao-titulo">Cartas ao Eu Futuro do mês</h2>
            ${Object.keys(cartasPorCategoria).length === 0
                ? `<div class="insight-card-box"><p class="insight-empty" style="text-align:center;">Nenhuma nota escrita esse mês.</p></div>`
                : Object.entries(cartasPorCategoria).map(([categoria, itens]) => `
                    <div class="insight-card-box">
                        <h3>${categoria}</h3>
                        <ul class="insight-card-list">
                            ${itens.map(c => `<li><span>${c.texto}</span><span class="valor-mono">${c.data.split("-").reverse().join("/")}</span></li>`).join("")}
                        </ul>
                    </div>
                `).join("")
            }
        `;
    }

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("sw.js")
                .then((reg) => console.log("Service worker registrado:", reg.scope))
                .catch((err) => console.warn("Falha ao registrar service worker:", err));
        });
    }
</script>

<script src="ios-warning.js"></script>
