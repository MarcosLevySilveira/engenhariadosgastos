<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gastos por Categoria e Mês</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .master {
      background: #eaeaea;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    .positivo { color: red; }
    .negativo { color: green; }
    tfoot {
      background: #ddd;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>Gastos por Categoria e Mês</h1>
  </header>

  <nav>
        <a href="index.html">Tabela de Gastos</a>
        <a href="cadastro4.html" class="active">Cadastrar Despesa/Entrada</a>
        <a href="debts.html">Dívidas</a>
        <a href="monthlyExpenses.html">Gastos Mensais</a>
        <a href="monthlyexpensestransfer.html">Transferências Mensais</a>
        <a href="mastermonthly.html">Gastos Macro</a>
        <a href="mastermonthlytransfer.html">Transferências Macro</a>
        <a href="dre.html">Despesas e receitas</a>
        <a href="burnporsemana.html">Burn por semana</a>
        <a href="exportpdf.html">Exportar PDF</a>
        <a href="game.html">InvestGame</a>
        <a href="portfolio.html">Portfolio</a>
  </nav>

  <main>
    <table>
      <thead id="cabecalho-tabela"></thead>
      <tbody id="corpo-tabela"></tbody>
      <tfoot id="rodape-tabela"></tfoot>
    </table>
  </main>

<script>
function carregarDespesas() {
  return JSON.parse(localStorage.getItem("despesas")) || [];
}

function agruparDespesasPorCategoriaEMes(despesas) {
  const dados = {};
  const mesesSet = new Set();

  despesas.forEach(d => {
    if (d.tipo !== "Transferência") return;

    const data = new Date(d.data);
    const mes = data.toISOString().slice(0,7);
    mesesSet.add(mes);

    const master = d.categoriaMaster || "Sem Master";
    const categoria = d.categoria || "Sem Categoria";

    if (!dados[master]) dados[master] = {};
    if (!dados[master][categoria]) dados[master][categoria] = {};
    if (!dados[master][categoria][mes]) dados[master][categoria][mes] = 0;

    dados[master][categoria][mes] += d.valor;
  });

  return {
    dados,
    meses: Array.from(mesesSet).sort()
  };
}

function calcularVariacao(valores, meses) {
  if (meses.length < 2) return "-";

  const ultimo = valores[meses[meses.length - 1]] || 0;
  const penultimo = valores[meses[meses.length - 2]] || 0;

  if (penultimo === 0) return ultimo > 0 ? "↑ 100%" : "-";

  const variacao = ((ultimo - penultimo) / penultimo) * 100;

  const classe = variacao > 0 ? "positivo" : "negativo";
  const seta = variacao > 0 ? "↑" : "↓";

  return `<span class="${classe}">${seta} ${variacao.toFixed(1)}%</span>`;
}

function montarTabela({ dados, meses }) {
  const cabecalho = document.getElementById("cabecalho-tabela");
  const corpo = document.getElementById("corpo-tabela");
  const rodape = document.getElementById("rodape-tabela");

  const mesesFormatados = meses.map(m => {
    const [ano, mes] = m.split("-");
    return new Date(ano, mes - 1)
      .toLocaleDateString("pt-BR", { month: "short", year: "2-digit" });
  });

  // Cabeçalho
  cabecalho.innerHTML = `
    <tr>
      <th>Categoria</th>
      ${mesesFormatados.map(m => `<th>${m}</th>`).join("")}
      <th>Total</th>
      <th>Var %</th>
    </tr>
  `;

  // 🔢 Totais gerais
  const totaisPorMes = Array(meses.length).fill(0);
  let totalGeral = 0;

  Object.entries(dados).forEach(([master, categorias], idx) => {

    const masterId = "m_" + idx;

    const totaisMaster = {};
    meses.forEach(m => {
      totaisMaster[m] = Object.values(categorias)
        .reduce((s, cat) => s + (cat[m] || 0), 0);
    });

    const totalMaster = Object.values(totaisMaster)
      .reduce((a,b) => a + b, 0);

    const variacaoMaster = calcularVariacao(totaisMaster, meses);

    // Linha master
    const trMaster = document.createElement("tr");
    trMaster.classList.add("master");

    trMaster.onclick = () => {
      document.querySelectorAll(`.sub-${masterId}`)
        .forEach(el => el.classList.toggle("hidden"));
    };

    trMaster.innerHTML = `
      <td><strong>▶ ${master}</strong></td>
      ${meses.map(m => `<td><strong>R$ ${(totaisMaster[m]||0).toFixed(2)}</strong></td>`).join("")}
      <td><strong>R$ ${totalMaster.toFixed(2)}</strong></td>
      <td>${variacaoMaster}</td>
    `;

    corpo.appendChild(trMaster);

    // Subcategorias
    Object.entries(categorias).forEach(([categoria, valores]) => {

      const total = meses.reduce((s,m)=>s+(valores[m]||0),0);

      // 🔢 acumula totais
      meses.forEach((m,i)=>{
        totaisPorMes[i] += (valores[m]||0);
      });
      totalGeral += total;

      const variacao = calcularVariacao(valores, meses);

      const tr = document.createElement("tr");
      tr.classList.add(`sub-${masterId}`, "hidden");

      tr.innerHTML = `
        <td style="padding-left:25px;">${categoria}</td>
        ${meses.map(m => `<td>R$ ${(valores[m]||0).toFixed(2)}</td>`).join("")}
        <td>R$ ${total.toFixed(2)}</td>
        <td>${variacao}</td>
      `;

      corpo.appendChild(tr);
    });
  });

  // 🧾 Rodapé (TOTAL GERAL)
  rodape.innerHTML = `
    <tr>
      <td>Total Geral</td>
      ${totaisPorMes.map(v => `<td>R$ ${v.toFixed(2)}</td>`).join("")}
      <td>R$ ${totalGeral.toFixed(2)}</td>
      <td>-</td>
    </tr>
  `;
}

window.onload = () => {
  const despesas = carregarDespesas();
  const agrupado = agruparDespesasPorCategoriaEMes(despesas);
  montarTabela(agrupado);
};
</script>

</body>
</html>
