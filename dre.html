<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRE - Demonstração do Resultado</title>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #f5f5f5; }
    .categoria-cell {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .dropdown {
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .dropdown:hover { background: #45a049; }
    .itens {
      display: none;
      font-size: 14px;
      margin: 6px 0 0 16px;
      list-style: none;
      padding: 0;
    }
    .highlight {
      font-weight: bold;
      background: #e6f7ff;
    }
    .expand-all-btn {
      background: #2196F3;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 12px;
    }
  </style>
</head>

<body onload="renderDRE()">

<h1>Demonstração do Resultado (DRE)</h1>

<label>Data inicial:</label>
<input type="date" id="dataInicio" onchange="renderDRE()">

<label>Data final:</label>
<input type="date" id="dataFim" onchange="renderDRE()">

<button class="expand-all-btn" onclick="toggleAllItens()">Expandir Tudo</button>

<table>
  <thead>
    <tr>
      <th>Categoria</th>
      <th>Valor (R$)</th>
    </tr>
  </thead>
  <tbody id="dreBody"></tbody>
</table>

<script>
let allExpanded = false;

// 🔥 CLASSIFICAÇÃO INTELIGENTE
function mapearMacro(d) {

  if (d.tipo === "Entrada") return "Entradas";

  // 🔒 Regras forçadas (prioridade máxima)
  const fixasForcadas = ["Pensão", "Contador"];
  if (fixasForcadas.includes(d.categoria)) {
    return "Despesas Fixas";
  }

  switch (d.categoriaMaster) {

    case "Moradia":
    case "Saúde":
    case "Educação":
      return "Despesas Fixas";

    case "Alimentação":
    case "Transporte":
    case "Lazer":
    case "Pessoal":
    case "Conexão e prazer":
      return "Despesas Variáveis";

    case "Dívidas e Obrigações":
      return "Impostos e Taxas";

    case "Investimentos":
      return "Investimentos";

    default:
      return "Outros";
  }
}

function renderDRE() {

  const despesas = JSON.parse(localStorage.getItem("despesas")) || [];
  const tbody = document.getElementById("dreBody");
  tbody.innerHTML = "";

  const inicio = document.getElementById("dataInicio").value;
  const fim = document.getElementById("dataFim").value;

  const filtradas = despesas.filter(d => {

    if (d.tipo === "Transferência") return false;

    if (inicio && d.data < inicio) return false;
    if (fim && d.data > fim) return false;

    return true;
  });

  const categorias = {
    "Entradas": [],
    "Despesas Fixas": [],
    "Despesas Variáveis": [],
    "Investimentos": [],
    "Impostos e Taxas": [],
    "Outros": []
  };

  filtradas.forEach(d => {
    const macro = mapearMacro(d);
    categorias[macro].push(d);
  });

  const soma = lista => lista.reduce((t, i) => t + i.valor, 0);

  const entradas = soma(categorias["Entradas"]);
  const fixas = soma(categorias["Despesas Fixas"]);
  const variaveis = soma(categorias["Despesas Variáveis"]);
  const investimentos = soma(categorias["Investimentos"]);
  const impostos = soma(categorias["Impostos e Taxas"]);
  const outros = soma(categorias["Outros"]);

  const operacional = entradas - fixas - variaveis;
  const liquido = operacional - investimentos - impostos - outros;

  const dre = [
    { nome: "Receita Bruta", valor: entradas, itens: categorias["Entradas"] },
    { nome: "(-) Despesas Fixas", valor: -fixas, itens: categorias["Despesas Fixas"] },
    { nome: "(-) Despesas Variáveis", valor: -variaveis, itens: categorias["Despesas Variáveis"] },
    { nome: "= Resultado Operacional", valor: operacional, itens: [] },
    { nome: "(-) Investimentos", valor: -investimentos, itens: categorias["Investimentos"] },
    { nome: "(-) Impostos e Taxas", valor: -impostos, itens: categorias["Impostos e Taxas"] },
    { nome: "(-) Outros", valor: -outros, itens: categorias["Outros"] },
    { nome: "= Resultado Líquido", valor: liquido, itens: [] }
  ];

  dre.forEach((linha, i) => {
    tbody.innerHTML += `
      <tr>
        <td class="categoria-cell ${linha.nome.startsWith('=') ? 'highlight' : ''}">
          ${linha.nome}
          ${linha.itens.length ? `<button class="dropdown" onclick="toggleItens(${i}, this)">Ver Itens</button>` : ""}
        </td>
        <td class="${linha.nome.startsWith('=') ? 'highlight' : ''}">
          ${linha.valor.toFixed(2)}
        </td>
      </tr>
      ${linha.itens.length ? `
      <tr>
        <td colspan="2">
          <ul class="itens" id="itens-${i}">
            ${linha.itens.map(x =>
              `<li>${x.data} - ${x.descricao} (${x.categoria}) - R$ ${x.valor.toFixed(2)}</li>`
            ).join("")}
          </ul>
        </td>
      </tr>` : ""}
    `;
  });

  const margem = entradas ? (liquido / entradas) * 100 : 0;

  tbody.innerHTML += `
    <tr>
      <td class="highlight">Margem (%)</td>
      <td class="highlight">${margem.toFixed(2)}%</td>
    </tr>
  `;

  allExpanded = false;
}

function toggleItens(i, btn) {
  const ul = document.getElementById(`itens-${i}`);
  const aberto = ul.style.display === "block";
  ul.style.display = aberto ? "none" : "block";
  btn.textContent = aberto ? "Ver Itens" : "Ocultar Itens";
}

function toggleAllItens() {
  allExpanded = !allExpanded;

  document.querySelectorAll(".itens").forEach(ul => {
    ul.style.display = allExpanded ? "block" : "none";
  });

  document.querySelectorAll(".dropdown").forEach(btn => {
    btn.textContent = allExpanded ? "Ocultar Itens" : "Ver Itens";
  });
}
</script>

</body>
</html>
