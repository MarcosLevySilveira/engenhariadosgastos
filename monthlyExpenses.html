  <main>
    <div class="form-header">
      <h1>Gastos por categoria e mês</h1>
    </div>

    <section class="ledger-section">
      <div class="ledger-wrap">
        <table class="ledger ledger--grid">
          <thead id="cabecalho-tabela"></thead>
          <tbody id="corpo-tabela"></tbody>
          <tfoot id="rodape-tabela"></tfoot>
        </table>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("navToggle").addEventListener("click", function () {
        const nav = document.getElementById("site-nav");
        const aberto = nav.classList.toggle("open");
        this.setAttribute("aria-expanded", aberto);
    });

    function formatarMoeda(valor) {
        return valor.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function carregarDespesas() {
      return JSON.parse(localStorage.getItem("despesas_demo")) || [];
    }

    function agruparDespesasPorCategoriaEMes(despesas) {
      const dados = {};
      const mesesSet = new Set();

      despesas.forEach(d => {
        if (d.tipo !== "Saída") return;

        const data = new Date(d.data);
        const mes = data.toISOString().slice(0,7); // "2025-05"
        mesesSet.add(mes);

        if (!dados[d.categoria]) dados[d.categoria] = {};
        if (!dados[d.categoria][mes]) dados[d.categoria][mes] = 0;

        dados[d.categoria][mes] += d.valor;
      });

      const mesesOrdenados = Array.from(mesesSet).sort();
      return { dados, meses: mesesOrdenados };
    }

    function montarTabela({ dados, meses }) {
      const cabecalho = document.getElementById("cabecalho-tabela");
      const corpo = document.getElementById("corpo-tabela");
      const rodape = document.getElementById("rodape-tabela");
      cabecalho.innerHTML = "";
      corpo.innerHTML = "";
      rodape.innerHTML = "";

      const mesesFormatados = meses.map(m => {
        const [ano, mes] = m.split("-");
        const data = new Date(ano, mes - 1);
        return data.toLocaleDateString("pt-BR", { month: "short", year: "2-digit" });
      });

      const rotulos = ["Categoria", ...mesesFormatados, "Total"];

      // Cabeçalho
      const trCabecalho = document.createElement("tr");
      trCabecalho.innerHTML = rotulos.map(r => `<th>${r}</th>`).join("");
      cabecalho.appendChild(trCabecalho);

      const categoriasOrdenadas = Object.entries(dados)
        .map(([categoria, valoresPorMes]) => {
          const total = meses.reduce((soma, mes) => soma + (valoresPorMes[mes] || 0), 0);
          return { categoria, valoresPorMes, total };
        })
        .sort((a, b) => b.total - a.total);

      const totaisPorMes = Array(meses.length).fill(0);

      categoriasOrdenadas.forEach(({ categoria, valoresPorMes, total }) => {
        const tr = document.createElement("tr");
        let linha = `<td data-label="${rotulos[0]}">${categoria}</td>`;
        meses.forEach((m, i) => {
          const valor = valoresPorMes[m] || 0;
          totaisPorMes[i] += valor;
          linha += `<td data-label="${rotulos[i + 1]}">R$ ${formatarMoeda(valor)}</td>`;
        });
        linha += `<td data-label="Total"><strong>R$ ${formatarMoeda(total)}</strong></td>`;
        tr.innerHTML = linha;
        corpo.appendChild(tr);
      });

      const trRodape = document.createElement("tr");
      let linhaRodape = `<td data-label="Categoria"><strong>Total por mês</strong></td>`;
      totaisPorMes.forEach((v, i) => {
        linhaRodape += `<td data-label="${rotulos[i + 1]}"><strong>R$ ${formatarMoeda(v)}</strong></td>`;
      });
      linhaRodape += `<td data-label="Total"></td>`;
      trRodape.innerHTML = linhaRodape;
      rodape.appendChild(trRodape);
    }

    window.onload = () => {
      const despesas = carregarDespesas();
      const agrupado = agruparDespesasPorCategoriaEMes(despesas);
      montarTabela(agrupado);
    }

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("sw.js")
                .then((reg) => console.log("Service worker registrado:", reg.scope))
                .catch((err) => console.warn("Falha ao registrar service worker:", err));
        });
    }
  </script>
